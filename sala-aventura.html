<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Aventura Solo · RPGForce</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --deep-wood: #1a120b;
            --burnished-gold: #bf9b5c;
            --dark-burgundy: #4a1e1e;
            --shadow-green: #1f3b2c;
            --blood-red: #8b0000;
            --soft-cream: #f8f0e3;
            --aged-paper: #d4c3a5;
            --card-bg: rgba(26, 18, 11, 0.95);
            
            --font-medieval: 'MedievalSharp', cursive;
            --font-cinzel: 'Cinzel', serif;
            --font-main: 'Inter', sans-serif;
            
            --border-ornate: 2px solid var(--burnished-gold);
            --shadow-heavy: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: var(--font-main);
            background: var(--deep-wood);
            color: var(--soft-cream);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* LAYOUT PRINCIPAL - MOBILE FIRST */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        /* HEADER FIXO */
        .app-header {
            background: linear-gradient(145deg, #2c1e12 0%, #1a120b 100%);
            border-bottom: var(--border-ornate);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left i {
            font-size: 1.5rem;
            color: var(--burnished-gold);
        }

        .header-left h1 {
            font-family: var(--font-medieval);
            font-size: 1.2rem;
            background: linear-gradient(135deg, #e4c590, #bf9b5c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-stats {
            display: flex;
            gap: 16px;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .stat-badge i.fa-heart { color: #ff6b6b; }
        .stat-badge i.fa-magic { color: #6b9fff; }
        .stat-badge i.fa-tint { color: #ffd966; }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--burnished-gold);
            color: var(--burnished-gold);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: var(--burnished-gold);
            color: var(--deep-wood);
        }

        /* ÁREA PRINCIPAL - SCROLLÁVEL */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* CARD DE CENÁRIO */
        .scenario-card {
            background: linear-gradient(145deg, #2c1e12, #1a120b);
            border: var(--border-ornate);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            min-height: 180px;
        }

        .scenario-image {
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .scenario-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to top, rgba(26, 18, 11, 0.9), transparent);
        }

        .scenario-title {
            position: absolute;
            bottom: 12px;
            left: 16px;
            font-family: var(--font-medieval);
            font-size: 1.4rem;
            color: var(--burnished-gold);
            text-shadow: 2px 2px 4px black;
            z-index: 2;
        }

        /* CARD DE NARRATIVA */
        .narrative-card {
            background: var(--card-bg);
            border: var(--border-ornate);
            border-radius: 20px;
            padding: 20px;
        }

        .narrative-text {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--soft-cream);
            white-space: pre-line;
            cursor: pointer;
            transition: all 0.2s;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border-left: 3px solid var(--burnished-gold);
            max-height: 200px;
            overflow-y: auto;
        }

        .narrative-text:active {
            transform: scale(0.99);
        }

        /* ESCOLHAS */
        .choices-container {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-choice {
            background: transparent;
            border: 2px solid var(--burnished-gold);
            color: var(--burnished-gold);
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 calc(50% - 12px);
            justify-content: center;
        }

        .btn-choice:hover {
            background: var(--burnished-gold);
            color: var(--deep-wood);
        }

        /* AÇÕES RÁPIDAS */
        .actions-bar {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-action {
            background: transparent;
            border: 2px solid var(--burnished-gold);
            color: var(--burnished-gold);
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
            min-width: 100px;
        }

        .btn-action:hover:not(:disabled) {
            background: var(--burnished-gold);
            color: var(--deep-wood);
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* MODAL GERAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #2c1e12, #1a120b);
            border: 3px solid var(--burnished-gold);
            border-radius: 30px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-content h2 {
            font-family: var(--font-medieval);
            color: var(--burnished-gold);
            font-size: 1.6rem;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--burnished-gold);
            padding-bottom: 10px;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: none;
            color: var(--burnished-gold);
            font-size: 1.5rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--burnished-gold);
            color: var(--deep-wood);
        }

        /* MODAL DE STATUS */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .status-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .status-label {
            font-size: 0.8rem;
            color: var(--aged-paper);
        }

        .status-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--burnished-gold);
        }

        /* MODAL DE COMBATE */
        .combat-modal {
            max-width: 600px;
            width: 95%;
        }

        .combat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .enemy-card {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            flex: 1;
        }

        .enemy-name {
            font-size: 1.4rem;
            color: var(--blood-red);
            font-family: var(--font-medieval);
        }

        .enemy-hp-bar {
            width: 100%;
            height: 16px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .enemy-hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b0000, #ff4444);
            width: 100%;
            transition: width 0.3s;
        }

        .combat-log {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin: 15px 0;
            font-size: 0.85rem;
        }

        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid rgba(191, 155, 92, 0.2);
        }

        .log-entry.critico { color: #4CAF50; font-weight: bold; }
        .log-entry.falha { color: #ff4444; font-weight: bold; }
        .log-entry.dano { color: #ff6b6b; }

        .combat-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .btn-combat {
            background: transparent;
            border: 2px solid var(--burnished-gold);
            color: var(--burnished-gold);
            padding: 12px 16px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            min-width: 100px;
        }

        .btn-combat:hover:not(:disabled) {
            background: var(--burnished-gold);
            color: var(--deep-wood);
        }

        .btn-combat:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .defense-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn-defense {
            background: transparent;
            border: 2px solid;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }

        .btn-defense.esquiva { border-color: #4CAF50; color: #4CAF50; }
        .btn-defense.aparar { border-color: #FF9800; color: #FF9800; }
        .btn-defense.bloqueio { border-color: #2196F3; color: #2196F3; }

        /* MODAL DE MAGIAS */
        .magias-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .magia-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--burnished-gold);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .magia-item:hover {
            background: rgba(191, 155, 92, 0.2);
        }

        .magia-nome {
            font-weight: 700;
            color: var(--burnished-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .magia-custo {
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .magia-desc {
            font-size: 0.8rem;
            color: var(--aged-paper);
            margin-top: 5px;
        }

        /* MODAL DE PERÍCIAS */
        .pericias-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pericia-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* MODAL DE INVENTÁRIO */
        .inventario-categoria {
            margin-bottom: 16px;
        }

        .inventario-categoria h4 {
            color: var(--burnished-gold);
            margin-bottom: 8px;
            border-left: 3px solid var(--burnished-gold);
            padding-left: 8px;
        }

        .item-lista {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }

        /* NPC CARD (DESKTOP) */
        .npc-card {
            display: none;
            background: var(--card-bg);
            border: var(--border-ornate);
            border-radius: 20px;
            padding: 16px;
            margin-top: 16px;
        }

        .npc-portrait {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--deep-wood);
            margin: 0 auto 12px;
            border: 3px solid var(--burnished-gold);
            background-size: cover;
            background-position: center;
        }

        .npc-name {
            font-family: var(--font-medieval);
            font-size: 1.2rem;
            color: var(--burnished-gold);
            text-align: center;
        }

        .npc-state {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin: 8px auto;
            text-align: center;
            width: fit-content;
        }

        .state-hostil { background: var(--blood-red); }
        .state-neutro { background: #2a2a2a; }
        .state-amigavel { background: var(--shadow-green); }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--burnished-gold);
            color: var(--deep-wood);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            z-index: 2000;
            display: none;
            white-space: nowrap;
        }

        .toast.show {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* LOADING */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(191, 155, 92, 0.2);
            border-top-color: var(--burnished-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* DESKTOP LAYOUT */
        @media (min-width: 768px) {
            .main-content {
                display: grid;
                grid-template-columns: 1fr 300px;
                gap: 20px;
            }

            .npc-card {
                display: block;
                position: sticky;
                top: 16px;
            }

            .btn-npc-mobile {
                display: none;
            }

            .actions-bar {
                grid-column: 1 / -1;
            }
        }

        /* MOBILE AJUSTES */
        @media (max-width: 767px) {
            .header-stats {
                gap: 8px;
            }

            .stat-badge {
                padding: 4px 8px;
                font-size: 0.7rem;
            }

            .stat-badge span {
                display: none;
            }

            .btn-choice {
                flex: 1 1 100%;
            }

            .btn-action {
                padding: 8px 12px;
                font-size: 0.8rem;
            }

            .btn-action span {
                display: none;
            }

            .scenario-title {
                font-size: 1.1rem;
            }
        }

        /* UTILIDADES */
        .text-center { text-align: center; }
        .mt-2 { margin-top: 8px; }
        .mb-2 { margin-bottom: 8px; }
        .w-100 { width: 100%; }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Carregando Aventura...</div>
    </div>

    <div class="toast" id="toast">Mensagem</div>

    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <i class="fas fa-scroll"></i>
                <h1 id="aventuraTitulo">Aventura Solo</h1>
            </div>
            <div class="header-stats">
                <div class="stat-badge"><i class="fas fa-heart"></i> <span id="headerPV">0</span></div>
                <div class="stat-badge"><i class="fas fa-magic"></i> <span id="headerPM">0</span></div>
                <div class="stat-badge"><i class="fas fa-tint"></i> <span id="headerPF">0</span></div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="btnStatus" title="Status do Personagem"><i class="fas fa-user"></i></button>
                <button class="btn-icon" id="btnPericias" title="Perícias"><i class="fas fa-brain"></i></button>
                <button class="btn-icon" id="btnMagias" title="Magias"><i class="fas fa-magic"></i></button>
                <button class="btn-icon" id="btnInventario" title="Inventário"><i class="fas fa-box"></i></button>
                <button class="btn-icon btn-npc-mobile" id="btnNpcMobile" title="NPC"><i class="fas fa-user-friends"></i></button>
                <button class="btn-icon" id="btnSair" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <div class="main-content">
            <!-- Cenário -->
            <div class="scenario-card">
                <div class="scenario-image" id="cenarioImagem" style="background-image: url('https://i.imgur.com/placeholder.jpg');">
                    <div class="scenario-title" id="cenarioTitulo">Carregando...</div>
                </div>
            </div>

            <!-- Narrativa e Escolhas -->
            <div class="narrative-card">
                <div class="narrative-text" id="narrativeText">Preparando sua aventura...</div>
                <div class="choices-container" id="choicesContainer"></div>
            </div>

            <!-- Ações Rápidas -->
            <div class="actions-bar">
                <button class="btn-action" id="actionAttack"><i class="fas fa-fist-raised"></i> <span>Atacar</span></button>
                <button class="btn-action" id="actionDefend"><i class="fas fa-shield-alt"></i> <span>Defender</span></button>
                <button class="btn-action" id="actionSpell"><i class="fas fa-magic"></i> <span>Magia</span></button>
                <button class="btn-action" id="actionFlee"><i class="fas fa-door-open"></i> <span>Fugir</span></button>
            </div>

            <!-- NPC Card (Desktop) -->
            <div class="npc-card" id="npcCard">
                <div class="npc-portrait" id="npcPortrait"></div>
                <div class="npc-name" id="npcName">—</div>
                <div class="npc-state" id="npcState">Neutro</div>
                <div class="npc-desc" id="npcDesc" style="font-size: 0.85rem; color: var(--aged-paper); text-align: center;">—</div>
            </div>
        </div>
    </div>

    <!-- MODAL STATUS -->
    <div class="modal-overlay" id="modalStatus">
        <div class="modal-content">
            <button class="modal-close" onclick="fecharModal('modalStatus')">&times;</button>
            <h2><i class="fas fa-user"></i> Status do Herói</h2>
            <div id="modalStatusContent"></div>
        </div>
    </div>

    <!-- MODAL PERÍCIAS -->
    <div class="modal-overlay" id="modalPericias">
        <div class="modal-content">
            <button class="modal-close" onclick="fecharModal('modalPericias')">&times;</button>
            <h2><i class="fas fa-brain"></i> Perícias</h2>
            <div id="modalPericiasContent" class="pericias-list"></div>
        </div>
    </div>

    <!-- MODAL MAGIAS -->
    <div class="modal-overlay" id="modalMagias">
        <div class="modal-content">
            <button class="modal-close" onclick="fecharModal('modalMagias')">&times;</button>
            <h2><i class="fas fa-magic"></i> Magias</h2>
            <div id="modalMagiasContent" class="magias-list"></div>
        </div>
    </div>

    <!-- MODAL INVENTÁRIO -->
    <div class="modal-overlay" id="modalInventario">
        <div class="modal-content">
            <button class="modal-close" onclick="fecharModal('modalInventario')">&times;</button>
            <h2><i class="fas fa-box"></i> Inventário</h2>
            <div id="modalInventarioContent"></div>
        </div>
    </div>

    <!-- MODAL COMBATE -->
    <div class="modal-overlay" id="modalCombate">
        <div class="modal-content combat-modal">
            <button class="modal-close" onclick="fecharModalCombate()">&times;</button>
            <h2><i class="fas fa-fist-raised"></i> COMBATE</h2>
            
            <div class="combat-header">
                <div class="enemy-card">
                    <div class="enemy-name" id="combatEnemyName">Inimigo</div>
                    <div class="enemy-hp-bar"><div class="enemy-hp-fill" id="combatEnemyHpBar" style="width: 100%"></div></div>
                    <div><span id="combatEnemyHp">0</span>/<span id="combatEnemyHpMax">0</span></div>
                </div>
                <div class="enemy-card" style="background: rgba(0,0,0,0.3);">
                    <div>Seu HP: <span id="combatPlayerHp">0</span></div>
                    <div>Seu PM: <span id="combatPlayerPm">0</span></div>
                </div>
            </div>
            
            <div class="combat-log" id="combatLog">
                <div class="log-entry">⚔️ Combate iniciado!</div>
            </div>
            
            <div id="combatActionsContainer">
                <div class="combat-actions" id="combatNormalActions">

    <script>
        // ============================================

        const firebaseConfig = {
            apiKey: "AIzaSyBrx4JSmFay24k95pu1ICjFfVki8gs_uHw",

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        // ============================================

        // ============================================
        let personagemAtual = null;
        let aventuraAtual = null;
        let combateAtivo = false;
        let combatState = null;
        let userId = null;
        
        // Catálogo de magias (simplificado - expandível)
        const CATALOGO_MAGIAS = {
            bolaDeFogo: { nome: "Bola de Fogo", escola: "fogo", custoPM: 3, dano: "2d6", descricao: "Projétil flamejante que causa 2d6 de dano" },
            criarFogo: { nome: "Criar Fogo", escola: "fogo", custoPM: 1, descricao: "Cria uma chama na palma da mão" },

            lampejo: { nome: "Lampejo", escola: "luz", custoPM: 2, descricao: "Ofusca um inimigo, penalidade -10% por 2 turnos" },
            drenarVitalidade: { nome: "Drenar Vitalidade", escola: "trevas", custoPM: 3, dano: "1d8", cura: "metade", descricao: "Causa dano e cura metade do dano" },
            toqueDrenante: { nome: "Toque Drenante", escola: "corpo", custoPM: 4, dano: "1d10", descricao: "Toque que drena a vida do alvo" }

        // ============================================
        // FUNÇÕES AUXILIARES
        // ============================================
        function mostrarLoading(mostrar) {

        }

        function mostrarToast(msg, erro = false) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = msg;
            toast.style.background = erro ? 'var(--blood-red)' : 'var(--burnished-gold)';
            toast.style.color = erro ? 'white' : 'var(--deep-wood)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function fecharModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.remove('active');
        }

        function fecharModalCombate() {
            document.getElementById('modalCombate').classList.remove('active');
            combateAtivo = false;
            combatState = null;
        }

        // ============================================
        // CÁLCULOS DE ATRIBUTOS (GENÉRICOS)
        // ============================================
        function getSTFixo(p) { return 5 + (p.atributos?.st?.esferas || 0); }
        function getDXFixo(p) { return 5 + (p.atributos?.dx?.esferas || 0); }
        function getIQFixo(p) { return 5 + (p.atributos?.iq?.esferas || 0); }
        function getVIGORFixo(p) { return 5 + (p.atributos?.vigor?.esferas || 0); }
        function getVTFixo(p) { return 5 + (p.atributos?.vt?.esferas || 0); }
        
        function getDXPercentual(p) { return 40 + ((p.atributos?.dx?.esferas || 0) * 2); }
        function getIQPercentual(p) { return 40 + ((p.atributos?.iq?.esferas || 0) * 2); }
        
        function calcularPV(p) {
            let pv = getVTFixo(p) * 8;
            if (p.vantagens?.includes('htExtra')) pv = Math.floor(pv * 1.1);
            return pv;
        }
        
        function calcularPM(p) { return getVIGORFixo(p) + getIQFixo(p) + getVTFixo(p); }
        function calcularPF(p) { return getVIGORFixo(p) + getVTFixo(p); }
        
        function getArmaEquipada(p) {
            return p.inventario?.corpo?.find(item => item.dano) || null;
        }
        
        function getPericiaParaArma(p, arma) {
            if (!arma) return 'luta';
            const nome = arma.nome?.toLowerCase() || '';
            if (nome.includes('espada')) return 'espada';
            if (nome.includes('machado')) return 'machado';
            if (nome.includes('martelo') || nome.includes('clava') || nome.includes('maça')) return 'armasHaste';
            if (nome.includes('lança')) return 'armasHaste';
            if (nome.includes('arco')) return 'arco';
            if (nome.includes('besta')) return 'besta';
            if (nome.includes('adaga')) return 'adaga';
            if (nome.includes('bastão')) return 'bastao';
            return 'luta';
        }
        
        function calcularNHJogador(p, periciaId) {
            const pericia = p.pericias?.[periciaId];
            let bonus = 0;
            if (pericia) bonus = (pericia.nivel || 0) * 4;
            
            let nh = getDXPercentual(p) + bonus;
            
            if (p.vantagens?.includes('reflexosRapidos') && periciaId !== 'arco' && periciaId !== 'besta') {
                nh += 5;
            }
            
            return Math.min(95, Math.max(5, nh));
        }
        
        function calcularDanoJogador(p, arma) {
            const stFixo = getSTFixo(p);
            let danoBase = 1;
            if (stFixo <= 5) danoBase = 1;
            else if (stFixo <= 8) danoBase = 2;
            else if (stFixo <= 11) danoBase = 4;
            else if (stFixo <= 14) danoBase = 6;
            else if (stFixo <= 17) danoBase = 8;
            else danoBase = 10;
            
            if (arma?.dano) {
                const armaDano = parseInt(arma.dano) || 2;
                danoBase += armaDano;
            }
            
            return Math.max(1, Math.floor(danoBase + (Math.random() * 4)));
        }
        
        function calcularEsquiva(p) {
            let esquiva = Math.floor((getDXPercentual(p) + 40 + ((p.atributos?.vigor?.esferas || 0) * 3)) / 2) + 5;
            if (p.vantagens?.includes('reflexosRapidos')) esquiva += 5;
            return Math.min(80, Math.max(5, esquiva));
        }
        
        function calcularAparar(p) {
            const arma = getArmaEquipada(p);
            if (!arma) return 0;
            const periciaId = getPericiaParaArma(p, arma);
            let aparar = calcularNHJogador(p, periciaId);
            if (p.vantagens?.includes('reflexosRapidos')) aparar += 5;
            return Math.min(80, Math.max(0, aparar));
        }
        
        function calcularBloqueio(p) {
            const temEscudo = p.inventario?.corpo?.some(item => item.bonus && item.nome?.toLowerCase().includes('escudo'));
            if (!temEscudo) return 0;
            const periciaEscudo = p.pericias?.escudo?.nivel || 0;
            let bloqueio = getDXPercentual(p) + (periciaEscudo * 4) + 5;
            if (p.vantagens?.includes('reflexosRapidos')) bloqueio += 5;
            return Math.min(85, Math.max(5, bloqueio));
        }
        
        function rolar2d10() {
            const d1 = Math.floor(Math.random() * 10) + 1;
            const d2 = Math.floor(Math.random() * 10) + 1;
            let resultado = (d1 === 10 ? 0 : d1) * 10 + (d2 === 10 ? 0 : d2);
            if (resultado === 0) resultado = 100;
            return { resultado, critico: resultado <= 6, falhaCritica: resultado >= 95, str: `[${d1}][${d2}] = ${resultado}` };
        }
        
        // ============================================
        // LISTAR MAGIAS DO PERSONAGEM
        // ============================================
        function listarMagiasPersonagem(p) {
            const magias = [];
            if (!p.escolas) return magias;
            
            for (const [escolaId, escola] of Object.entries(p.escolas)) {
                if (!escola.magias) continue;
                for (const [magiaId, magiaData] of Object.entries(escola.magias)) {
                    if (magiaData.desbloqueada === true) {
                        const catalogo = CATALOGO_MAGIAS[magiaId] || { nome: magiaId, descricao: "Efeito mágico", custoPM: 2 };
                        magias.push({
                            id: magiaId,
                            escola: escolaId,
                            nome: catalogo.nome,
                            custoPM: catalogo.custoPM,
                            descricao: catalogo.descricao,
                            nivel: magiaData.nivel || 1
                        });
                    }
                }
            }
            return magias;
        }
        
        // ============================================
        // ATUALIZAR INTERFACE
        // ============================================
        function atualizarHeader() {
            if (!personagemAtual) return;
            const status = personagemAtual.statusCombate || {};
            const pvMax = calcularPV(personagemAtual);
            const pmMax = calcularPM(personagemAtual);
            const pfMax = calcularPF(personagemAtual);
            
            document.getElementById('headerPV').textContent = `${status.vidaAtual || pvMax}/${pvMax}`;
            document.getElementById('headerPM').textContent = `${status.manaAtual || pmMax}/${pmMax}`;
            document.getElementById('headerPF').textContent = `${status.fadigaAtual || pfMax}/${pfMax}`;
        }
        
        function atualizarModalStatus() {
            if (!personagemAtual) return;
            const status = personagemAtual.statusCombate || {};
            const pvMax = calcularPV(personagemAtual);
            const pmMax = calcularPM(personagemAtual);
            const pfMax = calcularPF(personagemAtual);
            
            const nivel = (Object.values(personagemAtual.atributos || {}).reduce((a, b) => a + (b?.esferas || 0), 0)) + 1;
            
            document.getElementById('modalStatusContent').innerHTML = `
                <div class="status-grid">
                    <div class="status-item"><div class="status-label">PV</div><div class="status-value">${status.vidaAtual || pvMax}/${pvMax}</div></div>
                    <div class="status-item"><div class="status-label">PM</div><div class="status-value">${status.manaAtual || pmMax}/${pmMax}</div></div>
                    <div class="status-item"><div class="status-label">PF</div><div class="status-value">${status.fadigaAtual || pfMax}/${pfMax}</div></div>
                    <div class="status-item"><div class="status-label">Nível</div><div class="status-value">${nivel}</div></div>
                    <div class="status-item"><div class="status-label">Dinheiro</div><div class="status-value">$${personagemAtual.dinheiro || 0}</div></div>
                    <div class="status-item"><div class="status-label">XP</div><div class="status-value">${personagemAtual.xpAtual || 0}</div></div>
                </div>
                <div class="mt-2"><strong>Atributos:</strong></div>
                <div class="status-grid">
                    <div class="status-item"><div class="status-label">ST</div><div class="status-value">${getSTFixo(personagemAtual)}</div></div>
                    <div class="status-item"><div class="status-label">DX</div><div class="status-value">${getDXFixo(personagemAtual)}</div></div>
                    <div class="status-item"><div class="status-label">IQ</div><div class="status-value">${getIQFixo(personagemAtual)}</div></div>
                    <div class="status-item"><div class="status-label">VIGOR</div><div class="status-value">${getVIGORFixo(personagemAtual)}</div></div>
                    <div class="status-item"><div class="status-label">VT</div><div class="status-value">${getVTFixo(personagemAtual)}</div></div>
                </div>
                <div class="mt-2"><strong>Defesas:</strong></div>
                <div class="status-grid">
                    <div class="status-item"><div class="status-label">Esquiva</div><div class="status-value">${calcularEsquiva(personagemAtual)}%</div></div>
                    <div class="status-item"><div class="status-label">Aparar</div><div class="status-value">${calcularAparar(personagemAtual)}%</div></div>
                    <div class="status-item"><div class="status-label">Bloqueio</div><div class="status-value">${calcularBloqueio(personagemAtual)}%</div></div>
                </div>
            `;
        }
        
        function atualizarModalPericias() {
            if (!personagemAtual) return;
            const pericias = personagemAtual.pericias || {};
            if (Object.keys(pericias).length === 0) {
                document.getElementById('modalPericiasContent').innerHTML = '<div class="text-center" style="color: var(--aged-paper);">Nenhuma perícia</div>';
                return;
            }
            
            let html = '';
            for (const [id, data] of Object.entries(pericias)) {
                const nh = calcularNHJogador(personagemAtual, id);
                html += `
                    <div class="pericia-item">
                        <span><strong>${id.charAt(0).toUpperCase() + id.slice(1)}</strong> (Nv ${data.nivel || 0})</span>
                        <span style="color: #4CAF50;">${nh}%</span>
                    </div>
                `;
            }
            document.getElementById('modalPericiasContent').innerHTML = html;
        }
        
        function atualizarModalMagias() {
            if (!personagemAtual) return;
            const magias = listarMagiasPersonagem(personagemAtual);
            if (magias.length === 0) {
                document.getElementById('modalMagiasContent').innerHTML = '<div class="text-center" style="color: var(--aged-paper);">Nenhuma magia desbloqueada</div>';
                return;
            }
            
            let html = '';
            magias.forEach(m => {
                html += `
                    <div class="magia-item" onclick="usarMagia('${m.id}', '${m.escola}', '${m.nome}', ${m.custoPM}, '${m.descricao}')">
                        <div class="magia-nome">
                            ${m.nome}
                            <span class="magia-custo">${m.custoPM} PM</span>
                        </div>
                        <div class="magia-desc">${m.descricao}</div>
                    </div>
                `;
            });
            document.getElementById('modalMagiasContent').innerHTML = html;
        }
        
        function atualizarModalInventario() {
            if (!personagemAtual) return;
            const inv = personagemAtual.inventario || { corpo: [], mochila: [], deposito: [] };
            
            let html = '';
            
            if (inv.corpo?.length) {
                html += `<div class="inventario-categoria"><h4><i class="fas fa-user"></i> Equipado</h4>`;
                inv.corpo.forEach(item => {
                    html += `<div class="item-lista">${item.nome}${item.dano ? ` (${item.dano})` : ''}</div>`;
                });
                html += `</div>`;
            }
            
            if (inv.mochila?.length) {
                html += `<div class="inventario-categoria"><h4><i class="fas fa-backpack"></i> Mochila</h4>`;
                inv.mochila.forEach(item => {
                    html += `<div class="item-lista">${item.nome}${item.quantidade > 1 ? ` x${item.quantidade}` : ''}</div>`;
                });
                html += `</div>`;
            }
            
            if (inv.deposito?.length) {
                html += `<div class="inventario-categoria"><h4><i class="fas fa-archive"></i> Depósito</h4>`;
                inv.deposito.forEach(item => {
                    html += `<div class="item-lista">${item.nome}</div>`;
                });
                html += `</div>`;
            }
            
            document.getElementById('modalInventarioContent').innerHTML = html || '<div class="text-center" style="color: var(--aged-paper);">Inventário vazio</div>';
        }
        
        // ============================================
        // FUNÇÕES DE AÇÃO
        // ============================================
        window.usarMagia = function(magiaId, escola, nome, custoPM, descricao) {
            if (!personagemAtual) return;
            const pmAtual = personagemAtual.statusCombate?.manaAtual || calcularPM(personagemAtual);
            
            if (pmAtual < custoPM) {
                mostrarToast(`PM insuficiente! Precisa de ${custoPM} PM`, true);
                return;
            }
            
            document.getElementById('usarMagiaNome').textContent = nome;
            document.getElementById('usarMagiaDesc').textContent = descricao;
            document.getElementById('usarMagiaCusto').textContent = custoPM;
            document.getElementById('usarMagiaPmAtual').textContent = pmAtual;
            
            window.magiaSelecionada = { magiaId, escola, nome, custoPM, descricao };
            document.getElementById('modalUsarMagia').classList.add('active');
            fecharModal('modalMagias');
        };
        
        document.getElementById('confirmarUsarMagia')?.addEventListener('click', async () => {
            if (!window.magiaSelecionada || !personagemAtual) return;
            
            const { nome, custoPM } = window.magiaSelecionada;
            const pmAtual = personagemAtual.statusCombate?.manaAtual || calcularPM(personagemAtual);
            
            if (pmAtual < custoPM) {
                mostrarToast(`PM insuficiente!`, true);
                fecharModal('modalUsarMagia');
                return;
            }
            
            const novoPm = pmAtual - custoPM;
            
            try {
                await db.collection('personagens').doc(personagemAtual.id).update({
                    'statusCombate.manaAtual': novoPm
                });
                
                if (!personagemAtual.statusCombate) personagemAtual.statusCombate = {};
                personagemAtual.statusCombate.manaAtual = novoPm;
                
                mostrarToast(`✨ ${nome} conjurada! -${custoPM} PM`);
                atualizarHeader();
                fecharModal('modalUsarMagia');
                
                if (aventuraAtual?.cenaAtual) {
                    adicionarLogNarrativa(`Você conjurou ${nome}!`);
                }
            } catch (error) {
                mostrarToast('Erro ao usar magia', true);
            }
        });
        
        // ============================================
        // SISTEMA DE COMBATE SIMPLES
        // ============================================
        let inimigoAtual = null;
        
        function iniciarCombate(inimigo) {
            inimigoAtual = { ...inimigo, vidaAtual: inimigo.vidaMax };
            combateAtivo = true;
            combatState = { turno: 'jogador', aguardandoDefesa: false };
            
            document.getElementById('combatEnemyName').textContent = inimigo.nome;
            document.getElementById('combatEnemyHp').textContent = inimigo.vidaMax;
            document.getElementById('combatEnemyHpMax').textContent = inimigo.vidaMax;
            document.getElementById('combatEnemyHpBar').style.width = '100%';
            
            const pvAtual = personagemAtual.statusCombate?.vidaAtual || calcularPV(personagemAtual);
            const pmAtual = personagemAtual.statusCombate?.manaAtual || calcularPM(personagemAtual);
            document.getElementById('combatPlayerHp').textContent = pvAtual;
            document.getElementById('combatPlayerPm').textContent = pmAtual;
            
            const logDiv = document.getElementById('combatLog');
            logDiv.innerHTML = '<div class="log-entry">⚔️ COMBATE INICIADO!</div>';
            logDiv.innerHTML += `<div class="log-entry">👹 ${inimigo.nome} aparece!</div>`;
            logDiv.innerHTML += `<div class="log-entry">✨ Seu turno!</div>`;
            
            document.getElementById('combatNormalActions').style.display = 'flex';
            document.getElementById('combatDefenseContainer').style.display = 'none';
            
            document.getElementById('modalCombate').classList.add('active');
        }
        
        function adicionarLogCombate(msg, tipo = 'normal') {
            const logDiv = document.getElementById('combatLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${tipo}`;
            entry.textContent = msg;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        async function atacarCombate() {
            if (!combateAtivo || combatState.turno !== 'jogador' || combatState.aguardandoDefesa) return;
            
            const arma = getArmaEquipada(personagemAtual);
            const periciaId = getPericiaParaArma(personagemAtual, arma);
            const nh = calcularNHJogador(personagemAtual, periciaId);
            
            const rolagem = rolar2d10();
            adicionarLogCombate(`🎲 Seu ataque: ${rolagem.str} vs NH ${nh}%`);
            
            let acertou = false;
            if (rolagem.critico) {
                acertou = true;
                adicionarLogCombate(`✨✨ ATAQUE FULMINANTE!`, 'critico');
            } else if (rolagem.falhaCritica) {
                acertou = false;
                adicionarLogCombate(`💥 FALHA CRÍTICA!`, 'falha');
            } else {
                acertou = rolagem.resultado <= nh;
            }
            
            if (acertou) {
                const defesaInimigo = inimigoAtual.defesa || 25;
                const rolagemDefesa = rolar2d10();
                let defendeu = rolagemDefesa.resultado <= defesaInimigo;
                
                if (rolagemDefesa.critico) defendeu = true;
                if (rolagemDefesa.falhaCritica) defendeu = false;
                
                adicionarLogCombate(`🛡️ Defesa inimigo: ${rolagemDefesa.str} vs ${defesaInimigo}% → ${defendeu ? 'DEFENDEU' : 'FALHOU'}`);
                
                if (!defendeu) {
                    let dano = calcularDanoJogador(personagemAtual, arma);
                    if (rolagem.critico) dano *= 2;
                    
                    const rdInimigo = inimigoAtual.armadura || 0;
                    const danoFinal = Math.max(1, dano - rdInimigo);
                    
                    inimigoAtual.vidaAtual = Math.max(0, inimigoAtual.vidaAtual - danoFinal);
                    document.getElementById('combatEnemyHp').textContent = inimigoAtual.vidaAtual;
                    document.getElementById('combatEnemyHpBar').style.width = `${(inimigoAtual.vidaAtual / inimigoAtual.vidaMax) * 100}%`;
                    
                    adicionarLogCombate(`💥 Dano: ${danoFinal} (${dano} - ${rdInimigo} RD)`, 'dano');
                    
                    if (inimigoAtual.vidaAtual <= 0) {
                        adicionarLogCombate(`💀 ${inimigoAtual.nome} foi DERROTADO!`, 'critico');
                        combateAtivo = false;
                        setTimeout(() => {
                            fecharModalCombate();
                            mostrarToast(`Vitória! +${inimigoAtual.experiencia || 50} XP`);
                        }, 1500);
                        return;
                    }
                }
            }
            
            combatState.turno = 'inimigo';
            adicionarLogCombate(`👹 Turno do inimigo...`);
            
            setTimeout(() => turnoInimigo(), 1000);
        }
        
        async function turnoInimigo() {
            if (!combateAtivo) return;
            
            const nhInimigo = inimigoAtual.nh || 40;
            const rolagem = rolar2d10();
            
            adicionarLogCombate(`🎲 ${inimigoAtual.nome} ataca: ${rolagem.str} vs NH ${nhInimigo}%`);
            
            let acertou = false;
            if (rolagem.critico) {
                acertou = true;
                adicionarLogCombate(`✨✨ ATAQUE FULMINANTE DO INIMIGO!`, 'critico');
            } else if (rolagem.falhaCritica) {
                acertou = false;
                adicionarLogCombate(`💥 INIMIGO ERROU FEIO!`, 'falha');
            } else {
                acertou = rolagem.resultado <= nhInimigo;
            }
            
            if (acertou) {
                combatState.aguardandoDefesa = true;
                document.getElementById('combatNormalActions').style.display = 'none';
                document.getElementById('combatDefenseContainer').style.display = 'flex';
                adicionarLogCombate(`🛡️ ESCOLHA SUA DEFESA!`);
            } else {
                combatState.turno = 'jogador';
                combatState.aguardandoDefesa = false;
                adicionarLogCombate(`✨ Seu turno!`);
                document.getElementById('combatNormalActions').style.display = 'flex';
                document.getElementById('combatDefenseContainer').style.display = 'none';
            }
        }
        
        async function defender(tipo) {
            if (!combateAtivo || !combateState.aguardandoDefesa) return;
            
            let defesaBase = 0;
            if (tipo === 'esquiva') defesaBase = calcularEsquiva(personagemAtual);
            else if (tipo === 'aparar') defesaBase = calcularAparar(personagemAtual);
            else if (tipo === 'bloqueio') defesaBase = calcularBloqueio(personagemAtual);
            
            const rolagem = rolar2d10();
            let defendeu = false;
            
            if (rolagem.critico) {
                defendeu = true;
                adicionarLogCombate(`✨✨ DEFESA FULMINANTE!`, 'critico');
            } else if (rolagem.falhaCritica) {
                defendeu = false;
                adicionarLogCombate(`💥 FALHA CRÍTICA NA DEFESA!`, 'falha');
            } else {
                defendeu = rolagem.resultado <= defesaBase;
            }
            
            adicionarLogCombate(`🛡️ ${tipo}: ${rolagem.str} vs ${defesaBase}% → ${defendeu ? 'DEFENDEU' : 'FALHOU'}`);
            
            if (!defendeu) {
                const dano = (inimigoAtual.danoFormula ? parseInt(inimigoAtual.danoFormula) : 6) + (Math.random() * 6);
                const danoFinal = Math.max(1, Math.floor(dano));
                
                let pvAtual = personagemAtual.statusCombate?.vidaAtual || calcularPV(personagemAtual);
                pvAtual = Math.max(0, pvAtual - danoFinal);
                
                await db.collection('personagens').doc(personagemAtual.id).update({
                    'statusCombate.vidaAtual': pvAtual
                });
                personagemAtual.statusCombate.vidaAtual = pvAtual;
                
                adicionarLogCombate(`💥 Você sofreu ${danoFinal} de dano!`, 'dano');
                document.getElementById('combatPlayerHp').textContent = pvAtual;
                atualizarHeader();
                
                if (pvAtual <= 0) {
                    adicionarLogCombate(`💀 VOCÊ FOI DERROTADO!`, 'falha');
                    combateAtivo = false;
                    setTimeout(() => {
                        fecharModalCombate();
                        mostrarToast(`Você foi derrotado!`, true);
                    }, 1500);
                    return;
                }
            }
            
            combatState.aguardandoDefesa = false;
            combatState.turno = 'jogador';
            adicionarLogCombate(`✨ Seu turno!`);
            
            document.getElementById('combatNormalActions').style.display = 'flex';
            document.getElementById('combatDefenseContainer').style.display = 'none';
        }
        
        function fugirCombate() {
            if (!combateAtivo) return;
            
            const dx = getDXFixo(personagemAtual);
            const chance = 30 + (dx * 5);
            const rolagem = rolar2d10();
            
            if (rolagem.resultado <= chance) {
                adicionarLogCombate(`🏃 Você fugiu do combate!`, 'cura');
                combateAtivo = false;
                setTimeout(() => {
                    fecharModalCombate();
                    mostrarToast(`Você escapou!`);
                }, 1000);
            } else {
                adicionarLogCombate(`❌ Falhou ao fugir!`, 'falha');
                combatState.turno = 'inimigo';
                setTimeout(() => turnoInimigo(), 1000);
            }
        }
        
        // ============================================
        // SISTEMA DE AVENTURA
        // ============================================
        let cenaAtual = null;
        
        function carregarCena(cena) {
            if (!cena) return;
            cenaAtual = cena;
            
            document.getElementById('cenarioTitulo').textContent = cena.titulo || 'Aventura';
            document.getElementById('cenarioImagem').style.backgroundImage = `url('${cena.imagem || 'https://i.imgur.com/placeholder.jpg'}')`;
            document.getElementById('narrativeText').textContent = cena.narrativa || '...';
            
            if (cena.npc) {
                document.getElementById('npcName').textContent = cena.npc.nome || '—';
                document.getElementById('npcState').textContent = cena.npc.estado || 'Neutro';
                document.getElementById('npcState').className = `npc-state state-${(cena.npc.estado || 'neutro').toLowerCase()}`;
                document.getElementById('npcDesc').textContent = cena.npc.descricao || '—';
                if (cena.npc.portrait) {
                    document.getElementById('npcPortrait').style.backgroundImage = `url('${cena.npc.portrait}')`;
                }
            }
            
            const container = document.getElementById('choicesContainer');
            if (cena.opcoes && cena.opcoes.length) {
                container.innerHTML = cena.opcoes.map((op, i) => `
                    <button class="btn-choice" onclick="processarEscolha(${i})">
                        ${op.texto}
                    </button>
                `).join('');
            } else {
                container.innerHTML = '';
            }
        }
        
        window.processarEscolha = function(index) {
            if (!cenaAtual || !cenaAtual.opcoes[index]) return;
            const opcao = cenaAtual.opcoes[index];
            
            if (opcao.acao === 'iniciar_combate') {
                const inimigo = INIMIGOS[opcao.inimigo] || { nome: "Inimigo", vidaMax: 30, nh: 40, defesa: 25, experiencia: 50 };
                iniciarCombate(inimigo);
            } else if (opcao.acao === 'ir_para_cena') {
                carregarCena(CENAS[opcao.destino]);
            } else if (opcao.acao === 'teste_pericia') {
                const nh = calcularNHJogador(personagemAtual, opcao.pericia);
                const rolagem = rolar2d10();
                const sucesso = rolagem.resultado <= nh;
                mostrarToast(`${sucesso ? '✅ Sucesso!' : '❌ Falha!'} ${rolagem.str} vs ${nh}%`);
                carregarCena(CENAS[sucesso ? opcao.sucesso : opcao.falha]);
            }
        };
        
        function adicionarLogNarrativa(msg) {
            const narrativeDiv = document.getElementById('narrativeText');
            narrativeDiv.textContent = msg;
        }
        
        // ============================================
        // INIMIGOS SIMPLES
        // ============================================
        const INIMIGOS = {
            saqueador_faminto: { nome: "Saqueador Faminto", vidaMax: 25, nh: 35, defesa: 20, danoFormula: "1d6", armadura: 0, experiencia: 30 },
            lobo_solitario: { nome: "Lobo Solitário", vidaMax: 18, nh: 40, defesa: 25, danoFormula: "1d6+1", armadura: 1, experiencia: 35 },
            guarda_corrompido: { nome: "Guarda Corrompido", vidaMax: 35, nh: 45, defesa: 30, danoFormula: "1d8", armadura: 2, experiencia: 50 }
        };
        
        // ============================================
        // CENAS SIMPLES
        // ============================================
        const CENAS = {
            inicio: {
                id: "inicio",
                titulo: "O Grito na Estrada",
                imagem: "https://i.imgur.com/placeholder.jpg",
                narrativa: "O sol está baixo no horizonte enquanto você caminha por uma velha estrada. De repente, um grito corta o silêncio!\n\n— SOCORRO!\n\nVocê corre e encontra um camponês sendo atacado por um saqueador.",
                npc: { nome: "Camponês", estado: "amigavel", descricao: "Homem simples, com roupas rasgadas.", portrait: "" },
                opcoes: [
                    { texto: "⚔️ ATACAR o saqueador", acao: "iniciar_combate", inimigo: "saqueador_faminto" },
                    { texto: "💬 CONVERSAR", acao: "teste_pericia", pericia: "persuasao", sucesso: "conversa_sucesso", falha: "inicio" },
                    { texto: "🏃 FUGIR", acao: "ir_para_cena", destino: "fuga" }
                ]
            },
            conversa_sucesso: {
                id: "conversa_sucesso",
                titulo: "Palavras Acalmam",
                imagem: "https://i.imgur.com/placeholder.jpg",
                narrativa: "Suas palavras acalmam o agressor. Ele abaixa a arma e foge.\n\nO camponês agradece: 'Obrigado, aventureiro!'",
                npc: { nome: "Camponês Grato", estado: "amigavel", descricao: "Aliviado por ter escapado.", portrait: "" },
                opcoes: [
                    { texto: "🌄 CONTINUAR VIAGEM", acao: "ir_para_cena", destino: "fim" }
                ]
            },
            fuga: {
                id: "fuga",
                titulo: "Covardia",
                imagem: "https://i.imgur.com/placeholder.jpg",
                narrativa: "Você foge, ignorando os gritos. A culpa pesa em seus ombros.",
                npc: { nome: "—", estado: "neutro", descricao: "Você está sozinho.", portrait: "" },
                opcoes: [
                    { texto: "🔄 RECOMEÇAR", acao: "ir_para_cena", destino: "inicio" }
                ]
            },
            fim: {
                id: "fim",
                titulo: "Fim da Jornada",
                imagem: "https://i.imgur.com/placeholder.jpg",
                narrativa: "Sua aventura continua... Por enquanto, a história fica por aqui.",
                npc: { nome: "Fim", estado: "neutro", descricao: "Obrigado por jogar!", portrait: "" },
                opcoes: [
                    { texto: "🔄 RECOMEÇAR", acao: "ir_para_cena", destino: "inicio" }
                ]
            }
        };
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        async function carregarPersonagem(personagemId) {
            mostrarLoading(true);
            try {
                const docSnap = await db.collection('personagens').doc(personagemId).get();
                if (!docSnap.exists) {
                    mostrarToast('Personagem não encontrado!', true);
                    return false;
                }
                
                const data = docSnap.data();
                personagemAtual = { id: docSnap.id, ...data };
                
                if (!personagemAtual.statusCombate) {
                    personagemAtual.statusCombate = {
                        vidaAtual: calcularPV(personagemAtual),
                        manaAtual: calcularPM(personagemAtual),
                        fadigaAtual: calcularPF(personagemAtual)
                    };
                }
                
                atualizarHeader();
                carregarCena(CENAS.inicio);
                return true;
            } catch (error) {
                mostrarToast('Erro ao carregar: ' + error.message, true);
                return false;
            } finally {
                mostrarLoading(false);
            }
        }
        
        // EVENT LISTENERS
        document.getElementById('btnStatus')?.addEventListener('click', () => { atualizarModalStatus(); document.getElementById('modalStatus').classList.add('active'); });
        document.getElementById('btnPericias')?.addEventListener('click', () => { atualizarModalPericias(); document.getElementById('modalPericias').classList.add('active'); });
        document.getElementById('btnMagias')?.addEventListener('click', () => { atualizarModalMagias(); document.getElementById('modalMagias').classList.add('active'); });
        document.getElementById('btnInventario')?.addEventListener('click', () => { atualizarModalInventario(); document.getElementById('modalInventario').classList.add('active'); });
        document.getElementById('btnSair')?.addEventListener('click', async () => { await auth.signOut(); window.location.href = 'index.html'; });
        
        document.getElementById('actionAttack')?.addEventListener('click', () => {
            if (combateAtivo) atacarCombate();
            else if (cenaAtual?.opcoes?.[0]?.acao === 'iniciar_combate') processarEscolha(0);
            else mostrarToast('Nenhum combate ativo', true);
        });
        
        document.getElementById('actionSpell')?.addEventListener('click', () => {
            atualizarModalMagias();
            document.getElementById('modalMagias').classList.add('active');
        });
        
        document.getElementById('actionFlee')?.addEventListener('click', () => {
            if (combateAtivo) fugirCombate();
            else if (cenaAtual?.opcoes?.find(o => o.texto.includes('FUGIR'))) {
                const fuga = cenaAtual.opcoes.find(o => o.texto.includes('FUGIR'));
                if (fuga) processarEscolha(cenaAtual.opcoes.indexOf(fuga));
            } else mostrarToast('Não há como fugir aqui', true);
        });
        
        document.getElementById('combatAtacar')?.addEventListener('click', atacarCombate);
        document.getElementById('combatDefender')?.addEventListener('click', () => defender('aparar'));
        document.getElementById('combatEsquivar')?.addEventListener('click', () => defender('esquiva'));
        document.getElementById('combatFugir')?.addEventListener('click', fugirCombate);
        document.getElementById('combatDefesaEsquiva')?.addEventListener('click', () => defender('esquiva'));
        document.getElementById('combatDefesaAparar')?.addEventListener('click', () => defender('aparar'));
        document.getElementById('combatDefesaBloqueio')?.addEventListener('click', () => defender('bloqueio'));
        
        document.getElementById('btnNpcMobile')?.addEventListener('click', () => {
            const npcCard = document.getElementById('npcCard');
            if (npcCard) npcCard.style.display = npcCard.style.display === 'none' ? 'block' : 'none';
        });
        
        // INICIAR
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                userId = user.uid;
                const urlParams = new URLSearchParams(window.location.search);
                const personagemId = urlParams.get('personagem');
                if (personagemId) {
                    await carregarPersonagem(personagemId);
                } else {
                    mostrarToast('Nenhum personagem selecionado', true);
                    setTimeout(() => window.location.href = 'aventuras-solo.html', 2000);
                }
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
